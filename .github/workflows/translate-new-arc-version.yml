on:
  repository_dispatch:
    types: [arc-updated]  
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run translation
        run: python translate_last_version.py

  test:
    runs-on: ubuntu-latest
    needs: translate
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: # run tests on translation

  push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Push to this repo
        run: # push changes to ARC-Translations

  ping-link:
    runs-on: ubuntu-latest
    needs: push
    if: github.actor != 'aidanmarler' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger LINK update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LINK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aidanmarler/LINK/dispatches \
            -d '{"event_type": "arc-translations-updated"}'