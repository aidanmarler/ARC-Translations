on:
  repository_dispatch:
    types: [arc-updated]  
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install git+https://github.com/ISARICResearch/BRIDGE.git

      - name: Run translation
        run: python code/helloworld.py

      - name: Get latest ARC version path
        id: get_version
        run: python tests/get_version_path.py

      - name: Run translation tests
        run: pytest tests/test_arc_translations.py --translations-path=${{ steps.get_version.outputs.path }}

  push:
    runs-on: ubuntu-latest
    needs: translate
    steps:
      - uses: actions/checkout@v4
      - name: Push to this repo
        run: # push changes to ARC-Translations

  ping-link:
    runs-on: ubuntu-latest
    needs: push
    if: github.actor != 'aidanmarler' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger LINK update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LINK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aidanmarler/LINK/dispatches \
            -d '{"event_type": "arc-translations-updated"}'